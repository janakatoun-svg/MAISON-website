<div
  class="product-card"
  (click)="selectProduct()"
>

  <div class="product-image">

    <img
      [src]="product.image"
      [alt]="product.name"
    >

  </div>

  <div class="product-info">

    <h3>{{ product.name }}</h3>

    <p>{{ product.brand }}</p>

    <span>{{ product.price }}</span>

  </div>

</div>
